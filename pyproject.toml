[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscc-transcriptomics"
version = "1.0.0"
description = "Auditable paired RNA-seq reanalysis of GSE20116"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
oscc = "oscc.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: fits a small synthetic negative-binomial model"]
